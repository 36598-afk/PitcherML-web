<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0d14"/>
  <!-- Radial glow -->
  <radialGradient id="glow" cx="40%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#1d8cf8" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Pitch arc -->
  <path d="M 80 500 Q 500 120 800 280 T 1140 200" stroke="#1d8cf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Ball dot at end -->
  <circle cx="1140" cy="200" r="10" fill="#1d8cf8" opacity="0.9"/>
  <!-- Grid lines (subtle) -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1a2240" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1a2240" stroke-width="1"/>
  <!-- Eyebrow -->
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#1d8cf8" letter-spacing="4">PITCH ANALYTICS PLATFORM</text>
  <!-- Main headline -->
  <text x="80" y="310" font-family="system-ui, sans-serif" font-size="80" font-weight="900" fill="#e8eaf0" letter-spacing="-2">PitcherML</text>
  <!-- Subheadline -->
  <text x="80" y="375" font-family="system-ui, sans-serif" font-size="30" font-weight="400" fill="#6b7a99">Broadcast-grade pitch tracking &amp; analytics</text>
  <!-- Stats row -->
  <rect x="80" y="430" width="200" height="70" rx="8" fill="#0f1420" stroke="#1a2240" stroke-width="1"/>
  <text x="180" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#1d8cf8">95+</text>
  <text x="180" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7a99">MPH Tracking</text>
  <rect x="300" y="430" width="200" height="70" rx="8" fill="#0f1420" stroke="#1a2240" stroke-width="1"/>
  <text x="400" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#1d8cf8">9-Zone</text>
  <text x="400" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7a99">Strike Zone</text>
  <rect x="520" y="430" width="200" height="70" rx="8" fill="#0f1420" stroke="#1a2240" stroke-width="1"/>
  <text x="620" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#1d8cf8">AI</text>
  <text x="620" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7a99">Video Analysis</text>
  <!-- Domain -->
  <text x="80" y="590" font-family="system-ui, sans-serif" font-size="18" fill="#3a4460">pitcherml.com</text>
</svg>
